name: Publish to npm

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: true


      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"



      # - name: Install dependencies
      #   run: pnpm install

      # - name: Build
      #   run: pnpm build

      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks


